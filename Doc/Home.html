<!DOCTYPE HTML><html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AC Monitor</title>
  <style>
  body{
	text-align: center;
}
div.meter,
div.ac{
	display: inline-grid;
	gap: 10px;
}
div.meter > div,
div.ac > div{
	padding: 10px;
    width: 300px;
    border: 1px solid green;
    border-radius: 10px;
    text-align: center;
    font-size: 2em;
    background: #eee;
}
div.ac{
	margin: 0px 50px;
}

div.meter > div:hover,
div.ac > div:hover{
  background: #FFEB3B;
}
#bulb{
    width: 25px;
    height: 25px;
    background: #9E9E9E;
    border-radius: 100%;
    position: absolute;
    top: 25px;
    right: 25px;
}
#bulb.on{
    background: #03A9F4;
}
  </style>
  </head>
<body>
<div id= "bulb"></div>
<div class= "meter">
<div id="voltage">0 V</div>
<div id="Ampere">0 A</div>
<div id="watt">0 W</div>
<div id="kwh">0 KWH</div>
<div >Time: <span id="acTime"></span></div>
</div>


<div class= "ac">
<div >Power:<span id="iPower"></span></div>
<div >Mode:<span id="iMode"></span></div>
<div >Temp:<span id="iTemp"></span></div>
<div >Fan Speed:<span id="iFan"></span></div>
<div >SwingV:<span id="iSwingV"></span></div>
<div >SwingH:<span id="iSwingH"></span></div>
<div >Light:<span id="iLight"></span></div>
<div >Clean:<span id="iClean"></span></div>
<div >Turbo:<span id="iTurbo"></span></div>
<div >iFeel:<span id="iFeel"></span></div>
</div>

<div class= "meter">
<div id="temp">0 C</div>
</div>
<br>
<button class="btn" onclick="location.href='/webserial'">Web Serial</button>
<div id="error"></div>

<script>
function u(id,val){
document.getElementById(id).innerHTML = val;
}
function off(){
  setTimeout(() => {document.getElementById("bulb").classList.remove("on");}, 500);   
}
function getDate() {
  
  var x = new XMLHttpRequest();
  x.onreadystatechange = function() {
    if (this.readyState == 4 && this.status == 200) {
      try {
	      document.getElementById("bulb").classList.add("on");
            const obj = JSON.parse(x.responseText);
            u("voltage",obj.voltage + " V");
            u("Ampere",obj.ampere+ " A");
            u("watt",obj.watt+ " W");
            u("kwh", obj.kwh+ " Kwh");
            u("iPower",obj.iPower);
            u("iMode",obj.iMode);
			u("iTemp",obj.iTemp+" C");
            u("iFan",obj.iFan);
            u("iSwingV",obj.iSwingV);
			u("iSwingH",obj.iSwingH);
            u("iLight",obj.iLight);
            u("iClean",obj.iClean);
			u("iTurbo",obj.iTurbo);
            u("iFeel",obj.iFeel);
            u("temp",obj.temp+" C");
			u("acTime",obj.acTime);
            document.title ='AC Monitor';
			off();    
			}
      catch(err) {
	    u("error",err.message);
		off(); 
      }
	  
      setTimeout(getDate, 1500);
    }
};
x.open("GET", "/update", true);
x.send();
};
getDate();
</script>
</body>
</html>
